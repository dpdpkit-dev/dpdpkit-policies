[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dpdpkit-policies"
dynamic = ["version"]
description = "Versioned DPDP (India) policy packs and sector overlays for dpdpkit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dpdpkit maintainers" }]
keywords = ["dpdp", "privacy", "india", "consent", "data-protection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0", "jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-pyyaml", "types-jsonschema"]

[project.scripts]
dpdpkit-policies = "dpdpkit_policies.cli:main"

[project.urls]
Homepage = "https://github.com/dpdpkit-dev/dpdpkit-policies"
Changelog = "https://github.com/dpdpkit-dev/dpdpkit-policies/blob/main/CHANGELOG.md"
Issues = "https://github.com/dpdpkit-dev/dpdpkit-policies/issues"

[tool.hatch.version]
path = "src/dpdpkit_policies/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdpkit_policies"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
